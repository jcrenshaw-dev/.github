name: Bug
description: Something that works wrong, or a doc that says something false
type: Bug
labels: [needs-triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead. Paste exact error text.
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Stops me working
        - Wrong result, I can work around it
        - Minor or cosmetic
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest steps that show it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The version or commit you're running, and your operating system. If it runs inside Claude Code, the Claude Code version too.
    validations:
      required: true
